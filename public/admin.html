<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel administratora | CARSPA KATO</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="admin-container">
        <!-- Ekran logowania -->
        <div id="login" class="admin-box">
            <h2>CARSPA KATO</h2>
            <p>PANEL ADMINISTRATORA</p>
            <h3>LOGOWANIE</h3>
            
            <form id="loginForm">
                <label>Login</label>
                <input type="text" name="username" required placeholder="Wpisz login">
                
                <label>Hasło</label>
                <input type="password" name="password" required placeholder="Wpisz hasło">
                
                <button type="submit" class="primary-btn">ZALOGUJ SIĘ</button>
                <p id="loginMsg" class="error-msg"></p>
            </form>
        </div>

        <!-- Ekran panelu (ukryty do momentu zalogowania) -->
        <div id="dashboard" class="hidden">
            <header class="admin-header">
                <div>
                    <h2>Panel Administratora</h2>
                    <span id="adminEmail" class="muted"></span>
                </div>
                <button id="logout" class="danger-btn">Wyloguj się</button>
            </header>

            <nav class="admin-nav">
                <button data-tab="bookings" class="active">Rezerwacje</button>
                <button data-tab="services">Usługi i cennik</button>
                <button data-tab="gallery">Galeria zdjęć</button>
                <button data-tab="settings">Ustawienia strony</button>
            </nav>

            <p id="adminMsg" class="success-msg"></p>

            <!-- Zakładka: Rezerwacje -->
            <section id="tab-bookings" class="admin-tab">
                <h3>Zarządzanie rezerwacjami</h3>
                <div id="bookings">Ładowanie...</div>
            </section>

            <!-- Zakładka: Usługi -->
            <section id="tab-services" class="admin-tab hidden">
                <h3>Dodaj nową usługę</h3>
                <form id="serviceForm" class="admin-grid">
                    <label>Nazwa usługi <input name="name" required></label>
                    <label>Cena <input name="price" required></label>
                    <label>Opis <input name="description"></label>
                    <label>Czas realizacji <input name="duration"></label>
                    <button type="submit">Dodaj usługę</button>
                </form>
                <h3 style="margin-top: 30px;">Istniejące usługi</h3>
                <div id="servicesAdmin">Ładowanie...</div>
            </section>

            <!-- Zakładka: Galeria zdjęć -->
            <section id="tab-gallery" class="admin-tab hidden">
                <h3>GALERIA ZDJĘĆ</h3>
                <form id="galleryForm" class="admin-grid" enctype="multipart/form-data">
                    <label>Wybierz zdjęcie 
                        <input type="file" name="photo" accept="image/*" required>
                    </label>
                    <label>Podpis zdjęcia 
                        <input type="text" name="caption" placeholder="np. Skoda">
                    </label>
                    <button type="submit" class="primary-btn">Dodaj zdjęcie</button>
                </form>
                <h3 style="margin-top: 30px;">Aktualna galeria</h3>
                <div id="galleryAdmin" class="gallery-grid">Ładowanie...</div>
            </section>

            <!-- Zakładka: Ustawienia strony -->
            <section id="tab-settings" class="admin-tab hidden">
                <h3>Ustawienia strony</h3>
                <form id="settingsForm" class="admin-grid">
                    <label>Telefon kontaktowy <input name="phone"></label>
                    <label>Adres e-mail <input name="email"></label>
                    <label>Adres siedziby <input name="address"></label>
                    <button type="submit">Zapisz ustawienia</button>
                </form>
            </section>
        </div>
    </div>

    <script src="/admin.js"></script>
</body>
</html>
