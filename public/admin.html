<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administratora | CARSPA KATO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #121212; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        
        .login-wrapper { display: flex; align-items: center; justify-content: center; flex: 1; padding: 20px; }
        .login-box { background: #181818; border: 1px solid #2a2a2a; border-radius: 8px; padding: 40px; width: 100%; max-width: 440px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .brand-header { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .brand-mark { background: #ccff00; color: #000; font-weight: 900; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 20px; font-family: 'Barlow Condensed', sans-serif; }
        .brand-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.5px; line-height: 1.1; color: #fff; }
        .brand-title small { display: block; font-size: 10px; color: #888; font-family: 'Inter', sans-serif; letter-spacing: 1px; font-weight: 600; }

        h2.section-title { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 0.5px; }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; color: #aaa; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group textarea { background: #121212; border: 1px solid #333; border-radius: 4px; padding: 12px 15px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.3s; }
        .form-group input:focus, .form-group textarea:focus { border-color: #ccff00; }

        .btn-primary { background: #ccff00; color: #000; border: none; padding: 13px; font-weight: 700; width: 100%; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 14px; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; transition: background 0.3s; }
        .btn-primary:hover { background: #b3e600; }

        .error-msg { color: #ff4d4d; font-size: 13px; margin-top: 10px; text-align: center; }

        .admin-container { padding: 40px; max-width: 1200px; margin: 0 auto; width: 100%; flex: 1; display: none; }
        .admin-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #2a2a2a; padding-bottom: 20px; }
        
        .admin-nav { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }
        .tab-btn { background: #1a1a1a; color: #ccc; border: 1px solid #2a2a2a; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; text-transform: uppercase; transition: all 0.3s; }
        .tab-btn.active, .tab-btn:hover { background: #ccff00; color: #000; border-color: #ccff00; }

        .tab-content { display: none; background: #181818; border: 1px solid #2a2a2a; border-radius: 8px; padding: 30px; }
        .tab-content.active { display: block; }

        .logout-btn { background: transparent; color: #ff4d4d; border: 1px solid #ff4d4d; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: all 0.3s; }
        .logout-btn:hover { background: #ff4d4d; color: #fff; }

        .admin-gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .admin-gallery-item { background: #121212; border: 1px solid #2a2a2a; padding: 10px; border-radius: 6px; text-align: center; }
        .admin-gallery-item img { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; margin-bottom: 10px; }
        .btn-danger { background: #ff4d4d; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .upload-box { border: 2px dashed #333; padding: 25px; border-radius: 6px; text-align: center; margin-bottom: 20px; background: #121212; }
    </style>
</head>
<body>

    <!-- Ekran logowania -->
    <div id="loginSection" class="login-wrapper">
        <div class="login-box">
            <div class="brand-header">
                <div class="brand-mark">C</div>
                <div class="brand-title">CARSPA KATO<small>PANEL ADMINISTRATORA</small></div>
            </div>
            <h2 class="section-title">Logowanie</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Login</label>
                    <input type="text" id="username" required placeholder="Wpisz login...">
                </div>
                <div class="form-group">
                    <label>Hasło</label>
                    <input type="password" id="password" required placeholder="Wpisz hasło...">
                </div>
                <button type="submit" class="btn-primary">Zaloguj się</button>
                <div id="loginError" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- Panel Administratora -->
    <div id="adminSection" class="admin-container">
        <div class="admin-topbar">
            <div class="brand-header" style="margin-bottom:0;">
                <div class="brand-mark">C</div>
                <div class="brand-title">CARSPA KATO<small>PANEL ADMINISTRATORA</small></div>
            </div>
            <button id="logoutBtn" class="logout-btn" onclick="handleLogout()">Wyloguj się</button>
        </div>

        <div class="admin-nav">
            <button class="tab-btn active" onclick="switchTab('gallery', event)">Galeria zdjęć</button>
            <button class="tab-btn" onclick="switchTab('services', event)">Usługi i cennik</button>
            <button class="tab-btn" onclick="switchTab('settings', event)">Ustawienia / Kontakt</button>
        </div>

        <!-- Zakładka: Galeria -->
        <div id="tab-gallery" class="tab-content active">
            <h2 class="section-title">Galeria zdjęć realizacji</h2>
            <div class="upload-box">
                <form id="uploadForm" onsubmit="handleUpload(event)">
                    <input type="file" id="imageInput" name="image" accept="image/*" required style="margin-bottom: 15px; color: #aaa;"><br>
                    <button type="submit" class="btn-primary" style="max-width: 200px;">Dodaj zdjęcie</button>
                </form>
            </div>
            <div id="adminGalleryGrid" class="admin-gallery-grid"></div>
        </div>

        <!-- Zakładka: Usługi i cennik -->
        <div id="tab-services" class="tab-content">
            <h2 class="section-title">Zarządzanie usługami</h2>
            <div style="background: #121212; padding: 20px; border-radius: 6px; border: 1px solid #333; margin-bottom: 20px;">
                <h3 style="font-family: 'Barlow Condensed'; font-size: 20px; margin-bottom: 15px;">Dodaj nową usługę</h3>
                <form id="addServiceForm" onsubmit="handleAddService(event)">
                    <div class="form-group"><label>Nazwa usługi</label><input type="text" id="serviceName" required></div>
                    <div class="form-group"><label>Cena (np. od 500 zł)</label><input type="text" id="servicePrice" required></div>
                    <div class="form-group"><label>Opis</label><textarea id="serviceDesc" rows="3"></textarea></div>
                    <button type="submit" class="btn-primary" style="max-width: 200px;">Dodaj usługę</button>
                </form>
            </div>
            <div id="servicesList">Brak dodanych usług.</div>
        </div>

        <!-- Zakładka: Ustawienia / Kontakt -->
        <div id="tab-settings" class="tab-content">
            <h2 class="section-title">Dane kontaktowe i ustawienia</h2>
            <form id="settingsForm" onsubmit="handleSaveSettings(event)">
                <div class="form-group"><label>Numer telefonu</label><input type="text" id="setPhone" value="+48 000 000 000"></div>
                <div class="form-group"><label>Adres E-mail</label><input type="email" id="setEmail" value="kontakt@carspakato.pl"></div>
                <div class="form-group"><label>Adres / Lokalizacja</label><input type="text" id="setAddress" value="Katowice"></div>
                <button type="submit" class="btn-primary" style="max-width: 200px;">Zapisz ustawienia</button>
            </form>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);

        async function checkAuth() {
            try {
                const res = await fetch('/api/admin/me');
                if (res.ok) {
                    $('loginSection').style.display = 'none';
                    $('adminSection').style.display = 'block';
                    loadAdminGallery();
                }
            } catch (err) {
                console.log("Niezalogowany");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = $('username').value.trim();
            const password = $('password').value;
            const errorEl = $('loginError');
            errorEl.textContent = "Logowanie w toku...";

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (res.ok && data.success) {
                    $('loginSection').style.display = 'none';
                    $('adminSection').style.display = 'block';
                    loadAdminGallery();
                } else {
                    errorEl.textContent = data.error || "Nieprawidłowy login lub hasło.";
                }
            } catch (err) {
                errorEl.textContent = "Błąd połączenia z serwerem.";
            }
        }

        async function handleLogout() {
            await fetch('/api/admin/logout', { method: 'POST' });
            location.reload();
        }

        function switchTab(tabName, evt) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            if (tabName === 'gallery') $('tab-gallery').classList.add('active');
            if (tabName === 'services') $('tab-services').classList.add('active');
            if (tabName === 'settings') $('tab-settings').classList.add('active');
            
            if (evt) evt.currentTarget.classList.add('active');
        }

        async function handleUpload(e) {
            e.preventDefault();
            const fileInput = $('imageInput');
            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            try {
                const res = await fetch('/api/admin/gallery', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    fileInput.value = '';
                    loadAdminGallery();
                    alert("Zdjęcie zostało dodane pomyślnie!");
                } else {
                    alert(data.error || "Błąd podczas wgrywania zdjęcia.");
                }
            } catch (err) {
                alert("Błąd połączenia z serwerem.");
            }
        }

        async function loadAdminGallery() {
            try {
                const res = await fetch('/api/gallery');
                const images = await res.json();
                const grid = $('adminGalleryGrid');

                if (!images || images.length === 0) {
                    grid.innerHTML = '<p style="color: #888; grid-column: 1 / -1; text-align: center;">Brak zdjęć w galerii.</p>';
                    return;
                }

                grid.innerHTML = images.map(img => `
                    <div class="admin-gallery-item">
                        <img src="${img.url}" alt="Realizacja">
                        <button class="btn-danger" onclick="deleteImage(${img.id})">Usuń zdjęcie</button>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Błąd ładowania galerii", err);
            }
        }

        async function deleteImage(id) {
            if (!confirm("Czy na pewno chcesz usunąć to zdjęcie?")) return;
            try {
                const res = await fetch(`/api/admin/gallery/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadData();
                    loadAdminGallery();
                } else {
                    alert("Nie udało się usunąć zdjęcia.");
                }
            } catch (err) {
                alert("Błąd serwera.");
            }
        }

        function handleAddService(e) {
            e.preventDefault();
            alert("Usługa została dodana!");
            e.target.reset();
        }

        function handleSaveSettings(e) {
            e.preventDefault();
            alert("Ustawienia zostały zapisane!");
        }

        checkAuth();
    </script>
</body>
</html>
